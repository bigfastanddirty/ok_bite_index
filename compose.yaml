services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ok_lakes_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_ROOT}/ok_lakes/data:/var/lib/postgresql/data
      - ${DOCKER_ROOT}/ok_lakes/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - ok_fishing_net

  ingestor:
    build:
      context: ${DOCKER_ROOT}/ok_lakes/ingestor
    container_name: ok_lakes_ingestor
    restart: unless-stopped
    environment:
      DB_HOST: ok_lakes_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    depends_on:
      - timescaledb
    networks:
      - ok_fishing_net

  web:
    build:
      context: ${DOCKER_ROOT}/ok_lakes/web
    container_name: ok_lakes_web
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      DB_HOST: ok_lakes_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - timescaledb
    networks:
      - ok_fishing_net

networks:
  ok_fishing_net:
    driver: bridge
