services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ok_lakes_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_ROOT}/ok_lakes/data:/var/lib/postgresql/data
      - ${DOCKER_ROOT}/ok_lakes/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - ok_fishing_net

  ingestor:
    build:
      context: ${DOCKER_ROOT}/ok_lakes/ingestor
    container_name: ok_lakes_ingestor
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.environ['PGCONNECT_TIMEOUT']='4'; from pathlib import Path; assert b'ingest.py' in Path('/proc/1/cmdline').read_bytes(); import ingest; c=ingest.get_db_connection(); c.cursor().execute('SELECT 1'); c.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    environment:
      DB_HOST: ok_lakes_db
      DB_PORT: 5432
      USGS_API_KEY: ${USGS_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    depends_on:
      - timescaledb
    networks:
      - ok_fishing_net

  web:
    build:
      context: ${DOCKER_ROOT}/ok_lakes/web
    container_name: ok_lakes_web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/lakes',timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      DB_HOST: ok_lakes_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - timescaledb
    networks:
      - ok_fishing_net

networks:
  ok_fishing_net:
    driver: bridge
